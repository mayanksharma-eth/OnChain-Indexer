services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: indexer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indexer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies pending Drizzle migrations, then exits. api/indexer wait for this to
  # succeed before starting (depends_on: condition: service_completed_successfully below).
  migrate:
    build: .
    command: ["node", "packages/database/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/indexer
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    build: .
    command: ["node", "apps/indexer/dist/index.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/indexer
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL:?set RPC_URL in .env — see .env.example}
      CHAIN_ID: ${CHAIN_ID:-1}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:?set CONTRACT_ADDRESS in .env — see .env.example}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      INDEXER_CHUNK_SIZE: ${INDEXER_CHUNK_SIZE:-2000}
      INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-4000}
      CONFIRMATIONS: ${CONFIRMATIONS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional: the CoW Protocol adapter, indexing GPv2Settlement instead of the demo intent
  # contract. Not started by `docker compose up` by default — run explicitly with
  # `docker compose --profile cow up cow-indexer` once COW_CONTRACT_ADDRESS is set (see
  # .env.example). Same chainId/Postgres as `indexer`, checkpointed independently under
  # indexerName "cow-events" (see packages/database's indexer_checkpoints).
  cow-indexer:
    build: .
    profiles: ["cow"]
    command: ["node", "apps/indexer/dist/index-cow.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/indexer
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL:?set RPC_URL in .env — see .env.example}
      CHAIN_ID: ${CHAIN_ID:-1}
      CONTRACT_ADDRESS: ${COW_CONTRACT_ADDRESS:?set COW_CONTRACT_ADDRESS in .env — see .env.example}
      INDEXER_START_BLOCK: ${COW_START_BLOCK:-0}
      INDEXER_CHUNK_SIZE: ${INDEXER_CHUNK_SIZE:-2000}
      INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-4000}
      CONFIRMATIONS: ${CONFIRMATIONS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    command: ["node", "apps/api/dist/index.js"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/indexer
      REDIS_URL: redis://redis:6379
      CHAIN_ID: ${CHAIN_ID:-1}
      API_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
